<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Accès Sécurisé — Administration RAP ÉCOLE</title>

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js pour l'interactivité -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet"/>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b1120; /* Ardoise très douce et feutrée pour reposer les yeux */
      color: #e2e8f0;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased selection:bg-emerald-500 selection:text-white">

  <div class="w-full max-w-md">

    <!-- En-tête / Identité visuelle -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-slate-800 border border-slate-700/80 text-emerald-400 shadow-lg shadow-black/20 mb-4">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>

      <div class="inline-block px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider text-emerald-400 bg-emerald-950/60 border border-emerald-800/60 mb-2">
        Espace Réservé · Comité d'Organisation
      </div>
      <h1 class="text-2xl font-bold text-slate-100 tracking-tight">Panneau d'Administration</h1>
      <p class="text-sm text-slate-400 mt-1">RAP ÉCOLE Côte d'Ivoire · Session Sécurisée</p>
    </div>

    <!-- Carte du formulaire -->
    <div class="bg-slate-800/90 border border-slate-700/70 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-sm"
         x-data="{ showPass: false }">

      {% if erreur %}
      <!-- Alerte d'erreur douce et lisible -->
      <div class="mb-5 p-3.5 rounded-xl bg-rose-950/50 border border-rose-800/60 flex items-start gap-3 text-rose-200 text-xs">
        <svg class="w-5 h-5 text-rose-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <div class="font-medium leading-relaxed">{{ erreur }}</div>
      </div>
      {% endif %}

      <form method="POST" action="{% url 'admin_login' %}" class="space-y-5">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next_url }}"/>

        <div>
          <label for="mot_de_passe" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">
            Mot de passe administrateur
          </label>
          <div class="relative">
            <input
              :type="showPass ? 'text' : 'password'"
              id="mot_de_passe"
              name="mot_de_passe"
              required
              autofocus
              placeholder="Saisissez le mot de passe d'accès"
              class="w-full bg-slate-900/90 border border-slate-700 text-slate-100 placeholder-slate-500 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all pr-11"
            />
            <button
              type="button"
              @click="showPass = !showPass"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200 focus:outline-none transition-colors"
              title="Afficher / Masquer"
            >
              <!-- Œil ouvert -->
              <svg x-show="!showPass" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              <!-- Œil barré -->
              <svg x-show="showPass" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display: none;">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>
              </svg>
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="w-full py-3 px-4 rounded-xl font-semibold text-sm text-slate-900 bg-emerald-400 hover:bg-emerald-300 active:bg-emerald-500 shadow-md shadow-emerald-500/10 transition-all flex items-center justify-center gap-2"
        >
          <span>Accéder au panneau</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>
      </form>

      <!-- Note de sécurité discrète -->
      <div class="mt-6 pt-5 border-t border-slate-700/60 flex items-center justify-between text-xs text-slate-400">
        <span class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
          Système protégé
        </span>
        <a href="{% url 'home' %}" class="hover:text-slate-200 transition-colors flex items-center gap-1">
          ← Retour au portail public
        </a>
      </div>

    </div>

    <!-- Bas de page -->
    <div class="text-center mt-6 text-xs text-slate-400">
      Championnat Scolaire & Universitaire RAP ÉCOLE · Tous droits réservés
    </div>

  </div>

</body>
</html>
